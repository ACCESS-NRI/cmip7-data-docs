<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 666" width="960" height="666" role="img" aria-labelledby="t d" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Which way to find and access CMIP7 data</title>
<desc id="d">First find the data, then access it. If you have an NCI account and work on Gadi, find data with the ACCESS-NRI Interactive Data Catalogue, then copy the Python code it generates to load the data with Xarray in ARE JupyterLab, copy its ESMValCore code to run ESMValCore or ESMValTool, or copy the file paths for batch jobs, scripts or Xarray in ARE. Otherwise find data with ESGF MetaGrid, then access it: download in MetaGrid for browsing and small downloads, use the ESGF Python tools for large or scripted downloads, or use NCI THREDDS for small amounts of ACCESS model data.</desc>
<style>
  .lane-nci { fill: #00529B; fill-opacity: .055; }
  .lane-esgf { fill: #F28C00; fill-opacity: .07; }
  .card { fill: #FFFFFF; stroke: #D3DAE3; stroke-width: 1; }
  .ask { fill: #FFFFFF; stroke: #00529B; stroke-width: 1.5; }
  .main { fill: #17212B; }
  .sub { fill: #4B5563; }
  .if-nci { fill: #00529B; }
  .if-esgf { fill: #A85F00; }
  .wire { stroke: #9AA5B1; stroke-width: 2; fill: none; }
  .arrow { fill: #9AA5B1; }
  .branch { fill: #4B5563; font-size: 13px; font-weight: 500; }
  a .card, a .start { transition: stroke .15s; }
  a:hover .card { stroke: #007ACC; stroke-width: 2; }
  a:focus { outline: none; }
  a:focus .card, a:focus .start { stroke: #007ACC; stroke-width: 3; }
  @media (prefers-color-scheme: dark) {
    .lane-nci { fill: #8ED7F8; fill-opacity: .07; }
    .lane-esgf { fill: #F28C00; fill-opacity: .09; }
    .card { fill: #2C2D31; stroke: #4A4C53; }
    .ask { fill: #2C2D31; stroke: #8ED7F8; }
    .main { fill: #EBEBEB; }
    .sub { fill: #B4B8BF; }
    .if-nci { fill: #8ED7F8; }
    .if-esgf { fill: #F6A63A; }
    .wire { stroke: #6B7280; }
    .arrow { fill: #6B7280; }
    .branch { fill: #B4B8BF; }
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="ask" x="270" y="20" width="420" height="72" rx="36" style="stroke-width:2"/>
<text class="main" x="480" y="50" text-anchor="middle" font-size="17" font-weight="700">Do you have an NCI account</text>
<text class="main" x="480" y="73" text-anchor="middle" font-size="17" font-weight="700">and want to work on Gadi?</text>
<rect class="lane-nci" x="24" y="140" width="432" height="472" rx="18"/>
<path class="wire" d="M480,92 V112 H80 Q68,112 68,124 V188" marker-end="url(#ah)"/>
<text class="branch" x="198" y="106" text-anchor="middle">Yes</text>
<text class="if-nci" x="84" y="176" font-size="14" font-weight="700">1  Find the data</text>
<a href="../../find-cmip7-data/find-and-access-data/#access-nri-interactive-data-catalogue" target="_top"><title>Interactive Data Catalogue: read more</title>
<rect class="start" x="44" y="190" width="392" height="72" rx="12" fill="#00529B" stroke="#00529B"/>
<text x="64" y="221" font-size="18" font-weight="700" fill="#FFFFFF">Interactive Data Catalogue</text>
<text x="64" y="244" font-size="13.5" fill="#CFE6F7">Search what's on NCI, then copy code or paths</text>
<rect x="332" y="178" width="84" height="24" rx="12" fill="#A5CD3A" stroke="#00529B" stroke-width="2"/>
<text x="374" y="194.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1200">Start here</text>
</a>
<text class="if-nci" x="84" y="294" font-size="14" font-weight="700">2  Access the data</text>
<path class="wire" d="M68,262 V537.0 Q68,549.0 80,549.0 H94" marker-end="url(#ah)"/>
<path class="wire" d="M68,341.0 Q68,353.0 80,353.0 H94" marker-end="url(#ah)"/>
<path class="wire" d="M68,439.0 Q68,451.0 80,451.0 H94" marker-end="url(#ah)"/>
<a href="../../get-set-up-nci/set-up-jupyterlab/" target="_top"><title>Xarray in ARE JupyterLab: read more</title>
<rect class="card" x="96" y="310" width="340" height="86" rx="10"/>
<path d="M106,310 H101 Q96,310 96,315 V391 Q96,396 101,396 H106 V310 Z" fill="#007ACC"/>
<rect x="96" y="310" width="5" height="86" fill="#007ACC"/>
<text class="if-nci" x="118" y="334" font-size="12.5" font-weight="500">Copy the Python code</text>
<text class="main" x="118" y="359" font-size="16" font-weight="700">Xarray in ARE JupyterLab</text>
<text class="sub" x="118" y="380" font-size="13">paste into a notebook and analyse in place</text>
</a>
<a href="../../work-with-cmip7-data/analysis-tools/" target="_top"><title>Run ESMValCore or ESMValTool: read more</title>
<rect class="card" x="96" y="408" width="340" height="86" rx="10"/>
<path d="M106,408 H101 Q96,408 96,413 V489 Q96,494 101,494 H106 V408 Z" fill="#007ACC"/>
<rect x="96" y="408" width="5" height="86" fill="#007ACC"/>
<text class="if-nci" x="118" y="432" font-size="12.5" font-weight="500">Copy the ESMValCore code</text>
<text class="main" x="118" y="457" font-size="16" font-weight="700">Run ESMValCore or ESMValTool</text>
<text class="sub" x="118" y="478" font-size="13">generated for the datasets you selected</text>
</a>
<a href="../../find-cmip7-data/find-and-access-data/#advanced-fallback-nci-file-system" target="_top"><title>Use the paths however you work: read more</title>
<rect class="card" x="96" y="506" width="340" height="86" rx="10"/>
<path d="M106,506 H101 Q96,506 96,511 V587 Q96,592 101,592 H106 V506 Z" fill="#007ACC"/>
<rect x="96" y="506" width="5" height="86" fill="#007ACC"/>
<text class="if-nci" x="118" y="530" font-size="12.5" font-weight="500">Copy the file paths</text>
<text class="main" x="118" y="555" font-size="16" font-weight="700">Use the paths however you work</text>
<text class="sub" x="118" y="576" font-size="13">batch jobs and scripts, or Xarray in ARE</text>
</a>
<rect class="lane-esgf" x="504" y="140" width="432" height="472" rx="18"/>
<path class="wire" d="M480,92 V112 H536 Q548,112 548,124 V188" marker-end="url(#ah)"/>
<text class="branch" x="700" y="106" text-anchor="middle">No, or another platform</text>
<text class="if-esgf" x="564" y="176" font-size="14" font-weight="700">1  Find the data</text>
<a href="../../find-cmip7-data/find-and-access-data/#esgf-metagrid" target="_top"><title>ESGF MetaGrid: read more</title>
<rect class="start" x="524" y="190" width="392" height="72" rx="12" fill="#F28C00" stroke="#F28C00"/>
<text x="544" y="221" font-size="18" font-weight="700" fill="#1E1200">ESGF MetaGrid</text>
<text x="544" y="244" font-size="13.5" fill="#3D2600">Search the global CMIP7 archive</text>
<rect x="812" y="178" width="84" height="24" rx="12" fill="#FFFFFF" stroke="#F28C00" stroke-width="2"/>
<text x="854" y="194.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1200">Start here</text>
</a>
<text class="if-esgf" x="564" y="294" font-size="14" font-weight="700">2  Access the data</text>
<path class="wire" d="M548,262 V537.0 Q548,549.0 560,549.0 H574" marker-end="url(#ah)"/>
<path class="wire" d="M548,341.0 Q548,353.0 560,353.0 H574" marker-end="url(#ah)"/>
<path class="wire" d="M548,439.0 Q548,451.0 560,451.0 H574" marker-end="url(#ah)"/>
<a href="../../find-cmip7-data/find-and-access-data/#esgf-metagrid" target="_top"><title>Download in MetaGrid: read more</title>
<rect class="card" x="576" y="310" width="340" height="86" rx="10"/>
<path d="M586,310 H581 Q576,310 576,315 V391 Q576,396 581,396 H586 V310 Z" fill="#F28C00"/>
<rect x="576" y="310" width="5" height="86" fill="#F28C00"/>
<text class="if-esgf" x="598" y="334" font-size="12.5" font-weight="500">Browsing and small downloads</text>
<text class="main" x="598" y="359" font-size="16" font-weight="700">Download in MetaGrid</text>
<text class="sub" x="598" y="380" font-size="13">straight from your browser</text>
</a>
<a href="../../find-cmip7-data/find-and-access-data/#python-tools-and-other-platforms" target="_top"><title>ESGF Python tools: read more</title>
<rect class="card" x="576" y="408" width="340" height="86" rx="10"/>
<path d="M586,408 H581 Q576,408 576,413 V489 Q576,494 581,494 H586 V408 Z" fill="#F28C00"/>
<rect x="576" y="408" width="5" height="86" fill="#F28C00"/>
<text class="if-esgf" x="598" y="432" font-size="12.5" font-weight="500">Large or scripted downloads</text>
<text class="main" x="598" y="457" font-size="16" font-weight="700">ESGF Python tools</text>
<text class="sub" x="598" y="478" font-size="13">listed in the CMIP7 Guidance for Data Users</text>
</a>
<a href="../../find-cmip7-data/find-and-access-data/#nci-thredds" target="_top"><title>NCI THREDDS: read more</title>
<rect class="card" x="576" y="506" width="340" height="86" rx="10"/>
<path d="M586,506 H581 Q576,506 576,511 V587 Q576,592 581,592 H586 V506 Z" fill="#007ACC"/>
<rect x="576" y="506" width="5" height="86" fill="#007ACC"/>
<text class="if-esgf" x="598" y="530" font-size="12.5" font-weight="500">Small amounts of ACCESS model data</text>
<text class="main" x="598" y="555" font-size="16" font-weight="700">NCI THREDDS</text>
<text class="sub" x="598" y="576" font-size="13">files or OPeNDAP subsets, no account needed</text>
</a>
<rect x="24" y="634" width="5" height="16" fill="#007ACC"/><text class="sub" x="38" y="647" font-size="13">Data served from NCI</text>
<rect x="200" y="634" width="5" height="16" fill="#F28C00"/><text class="sub" x="214" y="647" font-size="13">Data downloaded from ESGF</text>
<text class="sub" x="936" y="647" font-size="13" text-anchor="end">Select any box to jump to its guide</text>
</svg>