<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Which way to find and access CMIP7 data</title>
<desc id="d">Do you have an NCI account and want to work on Gadi? If yes, find data with the ACCESS-NRI Interactive Data Catalogue, which searches NCI and ESGF holdings, then copy code or file paths from it: for exploring and analysing data, copy its Intake + Xarray code and run it in ARE JupyterLab on Gadi; for model evaluation and diagnostics, copy its ESMValCore or ESMValTool code into ARE JupyterLab or a PBS script; or, for your own tools and workflows, copy the file paths into scripts, PBS jobs or ARE on Gadi. If no, or you work on another platform, find data with either the Interactive Data Catalogue, which searches NCI and ESGF holdings and is easiest when searching for ACCESS models, or ESGF MetaGrid, which covers any model. Then download in MetaGrid for browsing and small downloads, or use the ESGF Python tools for large or scripted downloads. For ACCESS model data only, NCI THREDDS suits small amounts and NCI Globus suits larger transfers.</desc>
<style>
  .lane-nci { fill: #00529B; fill-opacity: .055; }
  .lane-esgf { fill: #F28C00; fill-opacity: .07; }
  .lane-access { fill: #A5CD3A; fill-opacity: .12; }
  .card { fill: #FFFFFF; stroke: #D3DAE3; stroke-width: 1; }
  .ask { fill: #FFFFFF; stroke: #00529B; stroke-width: 1.5; }
  .main { fill: #17212B; }
  .sub { fill: #4B5563; }
  .if-nci { fill: #00529B; }
  .if-esgf { fill: #A85F00; }
  .if-access { fill: #4D6B12; }
  .wire { stroke: #9AA5B1; stroke-width: 2; fill: none; }
  .arrow { fill: #9AA5B1; }
  .branch { fill: #4B5563; font-size: 13px; font-weight: 500; }
  .chip-nci { fill: #E6F1FA; stroke: #007ACC; }
  .chip-esgf { fill: #FEF1E0; stroke: #F28C00; }
  .chip-t { fill: #17212B; }
  a:hover .card { stroke: #007ACC; stroke-width: 2; }
  a:focus { outline: none; }
  a:focus .card, a:focus .start { stroke: #007ACC; stroke-width: 3; }
  @media (prefers-color-scheme: dark) {
    .lane-nci { fill: #8ED7F8; fill-opacity: .07; }
    .lane-esgf { fill: #F28C00; fill-opacity: .09; }
    .lane-access { fill: #A5CD3A; fill-opacity: .10; }
    .card { fill: #2C2D31; stroke: #4A4C53; }
    .ask { fill: #2C2D31; stroke: #8ED7F8; }
    .main { fill: #EBEBEB; }
    .sub { fill: #B4B8BF; }
    .if-nci { fill: #8ED7F8; }
    .if-esgf { fill: #F6A63A; }
    .if-access { fill: #BFE06A; }
    .wire { stroke: #6B7280; }
    .arrow { fill: #6B7280; }
    .branch { fill: #B4B8BF; }
    .chip-nci { fill: #1F3647; stroke: #8ED7F8; }
    .chip-esgf { fill: #3D2B12; stroke: #F6A63A; }
    .chip-t { fill: #EBEBEB; }
  }
</style>
<defs>
