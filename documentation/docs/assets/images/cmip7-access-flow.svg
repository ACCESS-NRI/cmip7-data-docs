<rect x="40" y="320" width="5" height="86" fill="#007ACC"/>
<text class="if-nci" x="60" y="344" font-size="12.5" font-weight="500">For exploring and analysing data</text>
<text class="main" x="60" y="369" font-size="16" font-weight="700">Intake + Xarray</text>
<text class="sub" x="60" y="390" font-size="13">Copy and run in ARE JupyterLab on Gadi</text>
</a>
<a href="../../find-cmip7-data/find-and-access-data/#access-the-data-you-find" target="_top"><title>ESMValCore or ESMValTool: read more</title>
<rect class="card" x="40" y="418" width="328" height="86" rx="10"/>
<path d="M50,418 H45 Q40,418 40,423 V499 Q40,504 45,504 H50 V418 Z" fill="#007ACC"/>
<rect x="40" y="418" width="5" height="86" fill="#007ACC"/>
<text class="if-nci" x="60" y="442" font-size="12.5" font-weight="500">For model evaluation and diagnostics</text>
<text class="main" x="60" y="467" font-size="16" font-weight="700">ESMValCore or ESMValTool</text>
<text class="sub" x="60" y="488" font-size="13">Copy into ARE JupyterLab or a PBS script</text>
</a>
<a href="../../find-cmip7-data/find-and-access-data/#nci-file-paths" target="_top"><title>File paths: read more</title>
<rect class="card" x="40" y="516" width="328" height="86" rx="10"/>
<path d="M50,516 H45 Q40,516 40,521 V597 Q40,602 45,602 H50 V516 Z" fill="#007ACC"/>
<rect x="40" y="516" width="5" height="86" fill="#007ACC"/>
<text class="if-nci" x="60" y="540" font-size="12.5" font-weight="500">For your own tools and workflows</text>
<text class="main" x="60" y="565" font-size="16" font-weight="700">File paths</text>
<text class="sub" x="60" y="586" font-size="13">Copy into scripts, PBS jobs or ARE</text>
</a>
<rect class="lane-esgf" x="408" y="140" width="528" height="426" rx="18"/>
<text class="if-esgf" x="428" y="168" font-size="14" font-weight="700">1  Find the data</text>
<a href="../../find-cmip7-data/find-and-access-data/#access-nri-interactive-data-catalogue" target="_top"><title>Interactive Data Catalogue: read more</title>
<rect class="start" x="424" y="182" width="304" height="94" rx="12" fill="#00529B" stroke="#00529B"/>
<text x="440" y="211" font-size="16" font-weight="700" fill="#FFFFFF">Interactive Data Catalogue</text>
<text x="440" y="235" font-size="12.5" fill="#CFE6F7">Searches NCI and ESGF holdings</text>
<text x="440" y="254" font-size="12.5" fill="#CFE6F7">Easiest when searching for ACCESS models</text>
</a>
<a href="../../find-cmip7-data/find-and-access-data/#esgf-metagrid" target="_top"><title>ESGF MetaGrid: read more</title>
<rect class="start" x="758" y="182" width="162" height="94" rx="12" fill="#F28C00" stroke="#F28C00"/>
<text x="774" y="211" font-size="16" font-weight="700" fill="#1E1200">ESGF MetaGrid</text>
<text x="774" y="235" font-size="12.5" fill="#3D2600">Any model,</text>
<text x="774" y="254" font-size="12.5" fill="#3D2600">whole archive</text>
</a>
<text class="sub" x="743" y="234" font-size="13" font-weight="700" text-anchor="middle">or</text>
<path class="wire" d="M576,276 V284 Q576,292 588,292 H660 Q672,292 672,300"/>
<path class="wire" d="M839,276 V284 Q839,292 827,292 H684 Q672,292 672,300 V318" marker-end="url(#ah)"/>
<text class="if-esgf" x="428" y="312" font-size="14" font-weight="700">2  Download it</text>
<a href="../../find-cmip7-data/find-and-access-data/#esgf-metagrid" target="_top"><title>Download in MetaGrid: read more</title>
<rect class="card" x="424" y="320" width="240" height="86" rx="10"/>
<path d="M434,320 H429 Q424,320 424,325 V401 Q424,406 429,406 H434 V320 Z" fill="#F28C00"/>
