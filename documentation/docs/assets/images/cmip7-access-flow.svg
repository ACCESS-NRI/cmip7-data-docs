<text x="60" y="213" font-size="18" font-weight="700" fill="#FFFFFF">Interactive Data Catalogue</text>
<text x="60" y="236" font-size="13.5" fill="#CFE6F7">Searches NCI and ESGF holdings</text>
<text x="60" y="255" font-size="13.5" fill="#CFE6F7">then copy code or file paths</text>
</a>
<text class="if-nci" x="44" y="306" font-size="14" font-weight="700">2  Access it on Gadi</text>
<a href="../../find-cmip7-data/find-and-access-data/#access-the-data-you-find" target="_top"><title>Intake + Xarray: read more</title>
