<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 934" width="960" height="934" role="img" aria-labelledby="t d" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Which tool to use to work with CMIP7 data</title>
<desc id="d">Step 1, start with your data. From the Interactive Data Catalogue, copy one of: Intake + Xarray code, file paths, ESMValCore code, or an ESMValTool recipe. If you just want to browse existing plots, open the REF (Rapid Evaluation Framework) dashboard, an international CMIP website that anyone can browse, separate from NCI and Gadi. Step 2, choose a tool on Gadi. Quick starts from the catalogue: to explore and plot interactively, copy the Intake + Xarray code or the file paths and use Xarray in ARE JupyterLab. To use any other tool, copy the file paths and work in ARE JupyterLab or a PBS job. For standardised, repeatable workflows, copy the ESMValCore code to prepare data in a notebook in ARE JupyterLab, or copy the ESMValTool recipe and run it across many datasets as a PBS job. Separately, to benchmark land processes against observations, run ILAMB as a PBS job; it reads data its own way and has no code to copy from the catalogue, so follow the ILAMB workflow guide. Step 3, more resources: the CMIP7 user guidance on grids and more, CMIP7 experiments and data standards, and where to ask a question.</desc>
